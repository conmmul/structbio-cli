[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "structbio"
version = "0.2.0"
description = "Short, reproducible commands for structural-biology software on a workstation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Structural Biology Laboratory"}]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6",
]

[project.scripts]
structbio = "structbio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/structbio"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Long lines are only ever quoted upstream commands and error text.
  "E501",
  # typer.Option(...) and typer.Argument(...) in a default is how Typer
  # declares a parameter; there is no other way to write it.
  "B008",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
